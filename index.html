<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Torque Converter</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f0ebe3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Torque">
<link rel="apple-touch-icon" href="icons/icon-512.png">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap');

  :root {
    --bg: #f0ebe3;
    --card: #faf8f5;
    --border: #e8e2d9;
    --text: #18150f;
    --text-mid: #6b6358;
    --text-soft: #b0a898;
    --active-border: #18150f;
    --key-bg: #faf8f5;
    --key-action: #eae5dc;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    height: 100dvh;
    overflow: hidden;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ── Top area ── */
  .top {
    width: 100%;
    max-width: 560px;
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 14px 14px 8px;
    gap: 7px;
    overflow: hidden;
    min-height: 0;
  }

  .topbar h1 {
    font-size: 0.65rem;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-soft);
    margin-bottom: 2px;
  }

  /* ── Fields ── */
  .field {
    background: var(--card);
    border-radius: 14px;
    padding: 10px 16px 9px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    border: 1.5px solid transparent;
    transition: border-color 0.15s;
    cursor: pointer;
    flex-shrink: 0;
  }

  .field.active-field { border-color: var(--active-border); }

  .field-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .field-label {
    font-size: 0.6rem;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-soft);
    transition: color 0.15s;
  }

  .active-field .field-label { color: var(--text-mid); }

  .field-unit {
    font-size: 0.6rem;
    font-weight: 500;
    color: var(--text-soft);
    letter-spacing: 0.06em;
    transition: color 0.15s;
  }

  .active-field .field-unit { color: var(--text-mid); }

  .field-value {
    font-size: 2rem;
    font-weight: 300;
    color: var(--text);
    letter-spacing: -0.02em;
    line-height: 1.15;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    width: 100%;
    transition: color 0.15s;
  }

  .field-value.placeholder { color: var(--border); }

  /* Cursor: inline after last digit, always on active field */
  .active-field .field-value::after {
    content: '';
    display: inline-block;
    width: 1.5px;
    height: 1.9rem;
    background: var(--text);
    border-radius: 1px;
    margin-left: 1px;
    vertical-align: middle;
    animation: blink 1s step-end infinite;
  }

  @keyframes blink { 0%,100% { opacity:1 } 50% { opacity:0 } }

  /* Smooth pop for converted values updating */
  @keyframes numPop {
    0%   { opacity: 0.4; transform: translateY(2px); }
    100% { opacity: 1;   transform: translateY(0); }
  }

  .field-value.updating { animation: numPop 0.12s ease-out forwards; }

  .card-applied-strip {
    height: 2px;
    background: transparent;
    border-radius: 0 0 14px 14px;
    transition: background 0.18s;
    margin: 4px -16px -9px;
  }
  .card-applied-strip.on { background: var(--text); }

  /* ── % buttons ── */
  .pct-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
    flex-shrink: 0;
  }

  .pct-btn {
    background: var(--card);
    color: var(--text-mid);
    border: 1.5px solid transparent;
    border-radius: 12px;
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 0.95rem;
    padding: 12px 8px;
    cursor: pointer;
    transition: all 0.13s;
    user-select: none;
    text-align: center;
    line-height: 1;
  }

  .pct-btn:active { transform: scale(0.97); }

  .pct-btn.applied {
    background: var(--text);
    color: var(--card);
    border-color: var(--text);
  }

  /* ── Keypad ── */
  .keypad {
    width: 100%;
    max-width: 560px;
    background: var(--key-action);
    border-top: 1px solid var(--border);
    padding: 8px 10px 10px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    flex-shrink: 0;
  }

  .key {
    background: var(--key-bg);
    border: none;
    border-radius: 10px;
    font-family: 'Inter', sans-serif;
    font-size: 1.3rem;
    font-weight: 400;
    color: var(--text);
    padding: 0;
    height: 52px;
    cursor: pointer;
    transition: background 0.1s, transform 0.08s;
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .key:active { background: var(--border); transform: scale(0.95); }

  .key.action {
    background: var(--key-action);
    color: var(--text-mid);
    font-size: 1rem;
    border: 1px solid var(--border);
  }

  .key.action:active { background: var(--border); }

  .key.clear-key {
    grid-column: 1 / -1;
    height: 44px;
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-soft);
    background: transparent;
    border: none;
  }

  .key.clear-key:active { color: var(--text-mid); background: transparent; transform: none; }

  .key.back svg { width: 22px; height: 22px; }
</style>
</head>
<body>

<div class="top">
  <div class="topbar"><h1>Torque Converter</h1></div>

  <div class="field" id="card-nm" onclick="setActive('nm')">
    <div class="field-header">
      <div class="field-label">Newton-metre</div>
      <div class="field-unit">N·m</div>
    </div>
    <div class="field-value placeholder" id="val-nm">0</div>
    <div class="card-applied-strip" id="strip-nm"></div>
  </div>

  <div class="field" id="card-ftlb" onclick="setActive('ftlb')">
    <div class="field-header">
      <div class="field-label">Foot-pound</div>
      <div class="field-unit">ft·lb</div>
    </div>
    <div class="field-value placeholder" id="val-ftlb">0</div>
    <div class="card-applied-strip" id="strip-ftlb"></div>
  </div>

  <div class="field" id="card-inlb" onclick="setActive('inlb')">
    <div class="field-header">
      <div class="field-label">Inch-pound</div>
      <div class="field-unit">in·lb</div>
    </div>
    <div class="field-value placeholder" id="val-inlb">0</div>
    <div class="card-applied-strip" id="strip-inlb"></div>
  </div>

  <div class="pct-row">
    <button class="pct-btn" id="btn10" onclick="applyPct(10)">+10%</button>
    <button class="pct-btn" id="btn20" onclick="applyPct(20)">+20%</button>
  </div>
</div>

<div class="keypad">
  <button class="key" onclick="keyPress('7')">7</button>
  <button class="key" onclick="keyPress('8')">8</button>
  <button class="key" onclick="keyPress('9')">9</button>

  <button class="key" onclick="keyPress('4')">4</button>
  <button class="key" onclick="keyPress('5')">5</button>
  <button class="key" onclick="keyPress('6')">6</button>

  <button class="key" onclick="keyPress('1')">1</button>
  <button class="key" onclick="keyPress('2')">2</button>
  <button class="key" onclick="keyPress('3')">3</button>

  <button class="key action" onclick="keyPress('.')">.</button>
  <button class="key" onclick="keyPress('0')">0</button>
  <button class="key action back" onclick="keyBackspace()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 6H9.5a2 2 0 0 0-1.45.62L3 12l5.05 5.38A2 2 0 0 0 9.5 18H20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2z"/>
      <line x1="15" y1="10" x2="11" y2="14"/><line x1="11" y1="10" x2="15" y2="14"/>
    </svg>
  </button>

  <button class="key clear-key" onclick="clearAll()">Clear all</button>
</div>

<script>
  const NM_PER_FTLB = 1.3558179483314004;
  const NM_PER_INLB = NM_PER_FTLB / 12;
  const TO_NM = { nm: 1, ftlb: NM_PER_FTLB, inlb: NM_PER_INLB };
  const units = ['nm', 'ftlb', 'inlb'];

  // rawValues: what the user has typed into the active field (per field)
  let rawValues  = { nm: '', ftlb: '', inlb: '' };
  // baseValues: converted numeric values before any % is applied
  let baseValues = { nm: null, ftlb: null, inlb: null };
  let activeUnit = 'nm';
  let appliedPct = 0;

  // ── Formatting ──────────────────────────────────────────────
  function fmt(val) {
    if (val === null || isNaN(val)) return '';
    if (val === 0) return '0';
    return parseFloat(val.toPrecision(6)).toString();
  }

  // ── Active field ─────────────────────────────────────────────
  function setActive(unit) {
    if (activeUnit === unit) return; // already active, nothing to do

    // If a % is currently applied, bake the displayed value into rawValues
    // for the new active field so typing continues from the adjusted number
    if (appliedPct && baseValues[unit] !== null) {
      rawValues[unit] = fmt(baseValues[unit] * (1 + appliedPct / 100));
      // Also store the % result as the new base so subsequent digits are additive
      const mult = 1 + appliedPct / 100;
      const newNm = baseValues[unit] * mult * TO_NM[unit];
      units.forEach(u => { baseValues[u] = newNm / TO_NM[u]; });
      rawValues[unit] = fmt(baseValues[unit]);
      appliedPct = 0;
      updatePctUI();
    }

    activeUnit = unit;
    units.forEach(u =>
      document.getElementById('card-' + u).classList.toggle('active-field', u === unit)
    );
    renderFields();
  }

  // ── Render ────────────────────────────────────────────────────
  function renderFields() {
    const mult = appliedPct ? (1 + appliedPct / 100) : 1;

    units.forEach(u => {
      const el = document.getElementById('val-' + u);

      let display;
      if (u === activeUnit) {
        // Active field: show what the user typed (or % result if applied)
        display = (appliedPct && baseValues[u] !== null)
          ? fmt(baseValues[u] * mult)
          : rawValues[u];
      } else {
        // Other fields: show converted + multiplied result
        display = (baseValues[u] !== null) ? fmt(baseValues[u] * mult) : '';
      }

      const isPlaceholder = !display;
      const newText = isPlaceholder ? '0' : display;

      // Animate only non-active fields when value actually changes
      if (u !== activeUnit && el.textContent !== newText) {
        el.classList.remove('updating');
        void el.offsetWidth; // restart animation
        el.classList.add('updating');
      }

      el.textContent = newText;
      el.classList.toggle('placeholder', isPlaceholder);
    });
  }

  // ── Convert from active field ─────────────────────────────────
  function convertFromActive() {
    const str = rawValues[activeUnit];
    const val = str === '' ? NaN : parseFloat(str);

    if (isNaN(val)) {
      // No valid input — clear everything
      units.forEach(u => { baseValues[u] = null; });
    } else {
      const nm = val * TO_NM[activeUnit];
      units.forEach(u => { baseValues[u] = nm / TO_NM[u]; });
    }

    // Any new keystroke resets an applied %
    if (appliedPct) {
      appliedPct = 0;
      updatePctUI();
    }

    renderFields();
  }

  // ── Keypad input ──────────────────────────────────────────────
  function keyPress(char) {
    // If a % is applied, clear it and start fresh from that result
    if (appliedPct && baseValues[activeUnit] !== null) {
      rawValues[activeUnit] = fmt(baseValues[activeUnit] * (1 + appliedPct / 100));
      const baked = parseFloat(rawValues[activeUnit]);
      const nm = baked * TO_NM[activeUnit];
      units.forEach(u => { baseValues[u] = nm / TO_NM[u]; });
      appliedPct = 0;
      updatePctUI();
    }

    let current = rawValues[activeUnit];

    if (char === '.') {
      if (current.includes('.')) return; // only one dot
      if (current === '') current = '0'; // lead with 0.
    } else {
      // Strip leading zero before a digit (but keep '0.')
      if (current === '0') current = '';
    }

    rawValues[activeUnit] = current + char;
    convertFromActive();
  }

  function keyBackspace() {
    // If % applied, clear it and restore base value to active field
    if (appliedPct) {
      rawValues[activeUnit] = fmt(baseValues[activeUnit]) ;
      appliedPct = 0;
      updatePctUI();
      renderFields();
      return;
    }
    rawValues[activeUnit] = rawValues[activeUnit].slice(0, -1);
    convertFromActive();
  }

  // ── % buttons ─────────────────────────────────────────────────
  function applyPct(pct) {
    if (!units.some(u => baseValues[u] !== null)) return;

    if (appliedPct === pct) {
      // Toggle off — revert display to base
      appliedPct = 0;
    } else {
      appliedPct = pct;
    }

    updatePctUI();
    renderFields();
  }

  function updatePctUI() {
    document.getElementById('btn10').classList.toggle('applied', appliedPct === 10);
    document.getElementById('btn20').classList.toggle('applied', appliedPct === 20);
    units.forEach(u => {
      document.getElementById('strip-' + u).className =
        'card-applied-strip' + (appliedPct ? ' on' : '');
    });
  }

  // ── Clear ─────────────────────────────────────────────────────
  function clearAll() {
    rawValues  = { nm: '', ftlb: '', inlb: '' };
    baseValues = { nm: null, ftlb: null, inlb: null };
    appliedPct = 0;
    activeUnit = 'nm';
    updatePctUI();
    units.forEach(u =>
      document.getElementById('card-' + u).classList.toggle('active-field', u === 'nm')
    );
    renderFields();
  }

  // ── Init ──────────────────────────────────────────────────────
  setActive('nm');
  renderFields();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(console.warn);
  }
</script>
</body>
</html>
