<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Torque Converter</title>

<!-- PWA -->
<link rel="manifest" href="/Torque-converter/manifest.json">
<meta name="theme-color" content="#f0ebe3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Torque">
<link rel="apple-touch-icon" href="/Torque-converter/icons/icon-512.png">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap');

  :root {
    --bg: #f0ebe3;
    --card: #faf8f5;
    --border: #e8e2d9;
    --text: #18150f;
    --text-mid: #6b6358;
    --text-soft: #b0a898;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    background: var(--bg);
    font-family: 'Inter', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    touch-action: manipulation;
  }

  .top {
    width: 100%;
    max-width: 560px;
    flex: 1;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .field {
    background: var(--card);
    border-radius: 14px;
    padding: 12px 16px;
    border: 1.5px solid transparent;
    cursor: pointer;
  }

  .field.active-field {
    border-color: var(--text);
  }

  .field-label {
    font-size: 0.6rem;
    color: var(--text-soft);
    text-transform: uppercase;
  }

  .field-value {
    font-size: 2rem;
    font-weight: 300;
  }

  .placeholder { color: var(--border); }

  .pct-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .pct-btn {
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: var(--card);
  }

  .pct-btn.applied {
    background: var(--text);
    color: white;
  }

  .keypad {
    width: 100%;
    max-width: 560px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    padding: 10px;
    touch-action: manipulation;
  }

  .key {
    height: 52px;
    font-size: 1.2rem;
    border-radius: 10px;
    border: none;
    background: white;
  }
</style>
</head>
<body>

<div class="top">
  <div class="field" id="card-nm" onclick="setActive('nm')">
    <div class="field-label">Newton-metre</div>
    <div class="field-value placeholder" id="val-nm">0</div>
  </div>

  <div class="field" id="card-ftlb" onclick="setActive('ftlb')">
    <div class="field-label">Foot-pound</div>
    <div class="field-value placeholder" id="val-ftlb">0</div>
  </div>

  <div class="field" id="card-inlb" onclick="setActive('inlb')">
    <div class="field-label">Inch-pound</div>
    <div class="field-value placeholder" id="val-inlb">0</div>
  </div>

  <div class="pct-row">
    <button class="pct-btn" id="btn10" onclick="applyPct(10)">+10%</button>
    <button class="pct-btn" id="btn20" onclick="applyPct(20)">+20%</button>
  </div>
</div>

<div class="keypad">
  <button class="key" onclick="keyPress('7')">7</button>
  <button class="key" onclick="keyPress('8')">8</button>
  <button class="key" onclick="keyPress('9')">9</button>

  <button class="key" onclick="keyPress('4')">4</button>
  <button class="key" onclick="keyPress('5')">5</button>
  <button class="key" onclick="keyPress('6')">6</button>

  <button class="key" onclick="keyPress('1')">1</button>
  <button class="key" onclick="keyPress('2')">2</button>
  <button class="key" onclick="keyPress('3')">3</button>

  <button class="key" onclick="keyPress('.')">.</button>
  <button class="key" onclick="keyPress('0')">0</button>
  <button class="key" 
    onmousedown="startBackspace()" 
    onmouseup="stopBackspace()" 
    ontouchstart="startBackspace()" 
    ontouchend="stopBackspace()">⌫</button>

  <button class="key" onclick="clearAll()">Clear</button>
</div>

<script>
const NM_PER_FTLB = 1.3558179483314004;
const NM_PER_INLB = NM_PER_FTLB / 12;
const TO_NM = { nm: 1, ftlb: NM_PER_FTLB, inlb: NM_PER_INLB };
const units = ['nm', 'ftlb', 'inlb'];

let rawValues = { nm: '', ftlb: '', inlb: '' };
let baseValues = { nm: null, ftlb: null, inlb: null };
let activeUnit = 'nm';
let appliedPct = 0;

function fmt(val) {
  if (val === null || isNaN(val)) return '';
  if (val === 0) return '0';
  return Number(val).toString();
}

function setActive(unit) {
  activeUnit = unit;
  units.forEach(u =>
    document.getElementById('card-' + u).classList.toggle('active-field', u === unit)
  );
  render();
}

function render() {
  const mult = appliedPct ? (1 + appliedPct / 100) : 1;

  units.forEach(u => {
    const el = document.getElementById('val-' + u);
    let display = '';

    if (u === activeUnit) {
      display = rawValues[u];
    } else if (baseValues[u] !== null) {
      display = fmt(baseValues[u] * mult);
    }

    el.textContent = display || '0';
    el.classList.toggle('placeholder', !display);
  });
}

function convert() {
  const val = parseFloat(rawValues[activeUnit]);

  if (isNaN(val)) {
    units.forEach(u => baseValues[u] = null);
  } else {
    const nm = val * TO_NM[activeUnit];
    units.forEach(u => baseValues[u] = nm / TO_NM[u]);
  }

  appliedPct = 0;
  render();
}

function keyPress(c) {
  if (navigator.vibrate) navigator.vibrate(10);

  let cur = rawValues[activeUnit];

  if (c === '.') {
    if (cur.includes('.')) return;
    if (!cur) cur = '0';
  }

  rawValues[activeUnit] = cur + c;
  convert();
}

function keyBackspace() {
  rawValues[activeUnit] = rawValues[activeUnit].slice(0, -1);
  convert();
}

let bsInt;
function startBackspace() {
  keyBackspace();
  bsInt = setInterval(keyBackspace, 120);
}
function stopBackspace() {
  clearInterval(bsInt);
}

function applyPct(p) {
  if (!units.some(u => baseValues[u] !== null)) return;
  appliedPct = appliedPct === p ? 0 : p;
  render();
}

function clearAll() {
  rawValues = { nm: '', ftlb: '', inlb: '' };
  baseValues = { nm: null, ftlb: null, inlb: null };
  appliedPct = 0;
  setActive('nm');
}

window.addEventListener('DOMContentLoaded', () => {
  setActive('nm');

  if (location.hash) {
    const h = location.hash.replace('#','');
    if (units.includes(h)) setActive(h);
  }
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/Torque-converter/sw.js')
    .catch(err => console.warn('SW failed:', err));
}
</script>

</body>
</html>
